<!DOCTYPE html>
<html>
<head>
    <title>Coach AI | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen">
    <nav class="p-10 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-black text-emerald-600">COACH<span class="text-slate-300">AI</span></h1>
        <a href="/logout" class="text-xs font-bold text-slate-400 hover:text-red-500 uppercase tracking-widest">Logout</a>
    </nav>
    <main class="max-w-2xl mx-auto mt-20 p-6 text-center">
        <h2 class="text-5xl font-bold mb-6 text-slate-900 tracking-tight">Focus your learning.</h2>
        <p class="text-slate-400 mb-12 text-lg">Select a guided coaching module to begin.</p>
        <form method="POST" class="space-y-4">
            {% for m in modules %}
            <button name="module" value="{{ m }}" class="w-full py-8 px-10 border-2 border-slate-50 rounded-[2rem] text-xl font-bold hover:border-emerald-500 hover:bg-emerald-50 transition-all text-left flex justify-between items-center group shadow-sm">
                {{ m }}
                <span class="text-emerald-500 opacity-0 group-hover:opacity-100 transition-opacity">Start Path →</span>
            </button>
            {% endfor %}
        </form>
    </main>
</body>
</html>
