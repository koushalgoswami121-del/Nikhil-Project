<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Room | Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col font-sans">

    <header class="w-full bg-white border-b border-indigo-100 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 text-white w-10 h-10 rounded-lg flex items-center justify-center font-bold">C</div>
            <h1 class="text-indigo-900 font-bold tracking-tight uppercase text-sm">Learning Mode</h1>
        </div>
        <div class="flex items-center gap-8">
            <div class="text-right">
                <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Session Progress</p>
                <p class="text-sm font-bold text-indigo-900">{{ progress }} of {{ total }}</p>
            </div>
            <a href="{{ url_for('hub') }}" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-100 transition">Exit</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-3xl w-full bg-white rounded-[2.5rem] shadow-xl shadow-indigo-200/50 p-12 border border-white">
            
            <div class="mb-10">
                <span class="inline-block bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-[10px] font-black uppercase mb-4 tracking-wider">Concept Drill</span>
                <h2 class="text-4xl font-bold text-slate-800 leading-tight">{{ q.text }}</h2>
            </div>

            <form method="POST" class="space-y-8">
                <div class="relative">
                    <textarea name="ans" rows="5" class="w-full bg-slate-50 border-2 border-slate-100 rounded-3xl p-8 text-lg text-slate-700 focus:border-indigo-400 focus:bg-white outline-none transition placeholder-slate-300 shadow-inner" placeholder="Explain this concept in your own words..." required></textarea>
                </div>
                
                <div class="flex items-center justify-between">
                    <p class="text-xs text-slate-400 font-medium italic">Coach AI will analyze your keywords for accuracy.</p>
                    <button type="submit" name="action" value="next" class="bg-indigo-600 hover:bg-indigo-700 text-white px-12 py-5 rounded-2xl font-black shadow-lg shadow-indigo-200 transition uppercase tracking-widest text-xs">
                        {% if progress == total %}Finish Session{% else %}Continue Session{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="p-8">
        <div class="max-w-4xl mx-auto w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
            <div class="bg-indigo-600 h-full transition-all duration-500" style="width: {{ (progress / total) * 100 }}%"></div>
        </div>
    </footer>

</body>
</html>
