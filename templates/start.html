<!DOCTYPE html>
<html lang="en">
<head>
    <title>Start Your Journey | Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-200 w-full max-w-md">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center text-white text-4xl font-bold mx-auto mb-6 shadow-lg shadow-blue-200">
                C
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Coach <span class="text-blue-600">AI</span></h1>
            <p class="text-slate-400 mt-2 text-sm font-medium">Smart Interview Preparation & Coaching</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-4 rounded-2xl text-xs font-bold {% if category == 'error' %}bg-red-50 text-red-500{% else %}bg-green-50 text-green-600{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Account Username</label>
                <input type="text" name="username" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-400 transition" placeholder="e.g. janesmith" required>
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Security Key</label>
                <input type="password" name="password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-400 transition" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 rounded-2xl transition shadow-lg shadow-blue-100 uppercase tracking-widest text-xs">
                Unlock My Potential
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-10">
            Ready to grow? <a href="/register" class="text-blue-600 font-bold hover:underline">Create Account</a>
        </p>
    </div>

</body>
</html>
