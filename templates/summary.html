<!DOCTYPE html>
<html>
<head><title>Coach AI | Results</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-12 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-4xl w-full text-center">
        <h1 class="text-[10rem] font-black text-slate-900 leading-none mb-4">{{ avg }}%</h1>
        <p class="text-[10px] font-black text-emerald-600 uppercase tracking-[0.5em] mb-12">Performance readiness</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div class="p-10 bg-slate-50 rounded-[3rem] border border-slate-100 text-center">
                <p class="text-[10px] font-black text-slate-300 uppercase mb-4 tracking-widest">AI Presence Analysis</p>
                <p class="text-sm font-bold text-slate-700 leading-relaxed">{{ feedback }}</p>
            </div>
            <div class="p-10 bg-slate-50 rounded-[3rem] border border-slate-100">
                <p class="text-[10px] font-black text-slate-300 uppercase mb-4 tracking-widest">Rubric Metrics</p>
                <div class="flex justify-center gap-2 mt-4">
                    <span class="bg-emerald-100 text-emerald-700 px-4 py-1 rounded-full text-[10px] font-bold uppercase">{{ rubric.tone }}</span>
                    <span class="bg-emerald-100 text-emerald-700 px-4 py-1 rounded-full text-[10px] font-bold uppercase">{{ rubric.pacing }}</span>
                </div>
            </div>
        </div>
        <a href="/hub" class="inline-block bg-slate-900 text-white px-14 py-5 rounded-full font-black uppercase text-xs tracking-widest shadow-2xl">New Session</a>
    </div>
</body>
</html>
