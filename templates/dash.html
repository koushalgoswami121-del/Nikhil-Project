<!DOCTYPE html>
<html>
<head>
    <title>Coach AI | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-mono min-h-screen flex flex-col">

    <nav class="p-8 flex justify-between border-b border-white/10">
        <div class="font-bold tracking-widest text-emerald-500">COACH_AI.v2</div>
        <a href="/logout" class="text-white/30 hover:text-white transition uppercase text-[10px] tracking-widest">Terminate_Session</a>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="max-w-md w-full text-center">
            <h1 class="text-xs tracking-[0.5em] text-white/40 uppercase mb-12">Select_Knowledge_Base</h1>
            
            <form method="POST" class="space-y-6">
                <div class="space-y-4">
                    {% for cat in cats %}
                    <label class="block cursor-pointer group">
                        <input type="radio" name="cat" value="{{ cat }}" class="hidden peer" {% if loop.first %}checked{% endif %}>
                        <div class="border border-white/10 p-6 rounded-sm peer-checked:border-emerald-500 peer-checked:bg-emerald-500/5 group-hover:bg-white/5 transition-all">
                            <span class="text-xl tracking-tight group-hover:text-emerald-400">{{ cat }}</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-5 mt-8 transition-all tracking-widest uppercase text-xs">
                    Initialize_Module
                </button>
            </form>
        </div>
    </main>

    <footer class="p-8 text-[10px] text-white/10 text-center uppercase tracking-widest">
        Active_User: {{ session['name'] }} | Environment: Development_Build
    </footer>

</body>
</html>
