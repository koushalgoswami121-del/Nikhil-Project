<!DOCTYPE html>
<html lang="en">
<head>
    <title>Summary | Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-500 h-screen flex items-center justify-center text-white font-sans">
    <div class="text-center p-10">
        <span class="text-[10px] font-black uppercase tracking-[0.5em] opacity-60">Module Complete</span>
        <h2 class="text-2xl font-bold mt-4 mb-12">Performance Summary</h2>
        
        <div class="text-[12rem] font-black leading-none mb-12 tracking-tighter">
            {{ score }}%
        </div>

        <p class="max-w-xs mx-auto text-emerald-100 mb-12 leading-relaxed">
            Your conceptual alignment with the coaching bank is strong. Continue practicing to reach 100%.
        </p>

        <div class="flex flex-col gap-4">
            <a href="/dashboard" class="bg-white text-emerald-600 px-12 py-5 rounded-full font-black text-xs uppercase tracking-widest hover:shadow-2xl transition-all">
                New Module
            </a>
            <a href="/logout" class="text-emerald-200 text-[10px] font-bold uppercase tracking-widest mt-4">Terminate Session</a>
        </div>
    </div>
</body>
</html>
