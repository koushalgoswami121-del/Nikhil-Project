<!DOCTYPE html>
<html>
<head><title>Register | Coach AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0b0f1a] text-white h-screen flex items-center justify-center font-sans">
    <div class="max-w-sm w-full p-10 bg-[#161b2c] rounded-[3rem] border border-white/5 shadow-2xl text-center">
        <h1 class="text-2xl font-black mb-10 text-white tracking-tight">Join Coach AI</h1>
        <form method="POST" class="space-y-6">
            <input type="text" name="u" placeholder="Username" class="w-full bg-[#0b0f1a] border border-white/10 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
            <input type="password" name="p" placeholder="Password" class="w-full bg-[#0b0f1a] border border-white/10 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
            <button type="submit" class="w-full bg-white text-slate-900 py-4 rounded-full font-black uppercase text-xs tracking-widest">Create Profile</button>
        </form>
        <a href="/login" class="inline-block mt-8 text-[10px] text-slate-500 font-bold uppercase tracking-widest">Back to Login</a>
    </div>
</body>
</html>
