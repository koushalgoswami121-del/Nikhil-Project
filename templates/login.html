<!DOCTYPE html>
<html>
<head><title>Login | Coach AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0b0f1a] text-white h-screen flex items-center justify-center font-sans">
    <div class="max-w-sm w-full p-10 bg-[#161b2c] rounded-[3rem] border border-white/5 shadow-2xl">
        <h1 class="text-2xl font-black text-center text-emerald-500 mb-8 tracking-tighter">COACH AI</h1>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}
        <div class="mb-6 p-4 bg-red-400/10 text-red-400 text-[10px] font-bold rounded-2xl text-center uppercase tracking-widest">{{ m }}</div>
        {% endfor %}{% endif %}{% endwith %}
        <form method="POST" class="space-y-6">
            <input type="text" name="u" placeholder="Username" class="w-full bg-[#0b0f1a] border border-white/10 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
            <input type="password" name="p" placeholder="Password" class="w-full bg-[#0b0f1a] border border-white/10 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
            <button type="submit" class="w-full bg-emerald-600 py-4 rounded-full font-black uppercase text-xs tracking-widest shadow-xl shadow-emerald-900/20">Authorize Access</button>
        </form>
        <p class="text-center text-[10px] text-slate-500 mt-10 uppercase font-bold tracking-widest">New? <a href="/register" class="text-emerald-500">Create Profile</a></p>
    </div>
</body>
</html>
