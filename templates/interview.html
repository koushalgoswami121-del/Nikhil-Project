<!DOCTYPE html>
<html>
<head>
    <title>Interview | Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col">
    <div class="h-1.5 w-full bg-slate-100">
        <div class="h-full bg-emerald-500 transition-all duration-1000" style="width: {{ (n/total)*100 }}%"></div>
    </div>
    
    <main class="flex-1 flex flex-col items-center justify-center p-10">
        <div class="max-w-3xl w-full">
            <div class="flex items-center gap-3 mb-8">
                <span class="w-8 h-[1px] bg-emerald-500"></span>
                <span class="text-emerald-500 font-bold uppercase text-[10px] tracking-[0.4em]">Step {{ n }} of {{ total }}</span>
            </div>
            
            <h1 class="text-4xl font-bold mb-16 leading-[1.3] text-slate-900">{{ question }}</h1>
            
            <form method="POST">
                <textarea name="ans" rows="5" class="w-full text-2xl border-none outline-none focus:ring-0 placeholder:text-slate-200 resize-none mb-16" placeholder="Type your answer here..." autofocus required></textarea>
                
                <div class="flex justify-between items-center pt-10 border-t border-slate-100">
                    <p class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">Guided AI Session Active</p>
                    <button type="submit" class="bg-emerald-600 text-white px-12 py-5 rounded-full font-black hover:bg-emerald-700 transition-all shadow-xl shadow-emerald-100 uppercase text-xs tracking-widest">
                        Submit Answer
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
